# A CI configuration to publish package:webdev to pub.dev.

name: Publish package:webdev

on:
  push:
    tags:
      - 'webdev-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    if: ${{ github.repository_owner == 'dart-lang' }}
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6eae1842087284e3f4d3b0b2ae847d72e6046d8c # dart-lang/setup-dart#206
    with:
      working-directory: webdev
      sdk: dev
      use-flutter: false
