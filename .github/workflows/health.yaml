name: Health
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  health:
    uses: dart-lang/ecosystem/.github/workflows/health.yaml@27c2fc841818cce349e1f424af51cca9ea381f47 # main
    with:
      checks: "publish"
      fail_on: "publish"
      warn_on: "license,coverage,breaking,leaking,unused-dependencies"
      sdk: dev
    permissions:
      pull-requests: write
