name: dwds_webdev_integration_test
publish_to: none
description: >-
  DWDS integration tests run from webdev, e.g. the shared DWDS test suites from
  the Dart SDK against apps built with build_runner (via the build daemon).
environment:
  sdk: ^3.14.0-286.0.dev

dev_dependencies:
  build_daemon: ^4.1.4
  dart_flutter_team_lints: ^3.5.2
  dwds: any
  dwds_test_common: any
  http: ^1.0.0
  logging: ^1.0.2
  shelf: ^1.3.0
  shelf_proxy: ^1.0.4
  test: ^1.21.6
  vm_service: ">=14.2.4 <16.0.0"
  webkit_inspection_protocol: ^1.0.1

# DWDS and its shared test suites live in the Dart SDK. Always test against the
# latest versions there.
dependency_overrides:
  dwds:
    git:
      url: https://github.com/dart-lang/sdk.git
      ref: main
      path: pkg/dwds
  dwds_test_common:
    git:
      url: https://github.com/dart-lang/sdk.git
      ref: main
      path: pkg/dwds_test_common
