# See https://pub.dev/packages/mono_repo for details
stages:
  - analyzer_and_format:
    - group:
      - format
      - analyze: --fatal-infos .
      - test: test/build/ensure_build_test.dart
      sdk: dev
  - unit_test:
    - group:
      - command: Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
      - command: mkdir -p ../../third_party/browsers/chrome/chrome && ln -s /usr/bin/google-chrome ../../third_party/browsers/chrome/chrome/google-chrome
      - test: -j 1
      sdk: dev
    - test: -j 1
      os: windows
      sdk: dev
  - beta_cron:
    - analyze: .
      sdk: beta
    - group:
      - command: Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
      - command: mkdir -p ../../third_party/browsers/chrome/chrome && ln -s /usr/bin/google-chrome ../../third_party/browsers/chrome/chrome/google-chrome
      - test: -j 1
      sdk: beta
    - test: -j 1
      os: windows
      sdk: beta
