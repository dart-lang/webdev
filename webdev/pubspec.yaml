name: webdev
# Every time this changes you need to run `dart run build_runner build`.
version: 4.0.0
# We should not depend on a dev SDK before publishing.
# publish_to: none
description: >-
  A CLI for Dart web development. Provides an easy and consistent set of
  features for users and tools to build and deploy web applications with Dart.
repository: https://github.com/dart-lang/webdev/tree/main/webdev
environment:
  sdk: ^3.10.0-0.0.dev

dependencies:
  args: ^2.3.1
  async: ^2.9.0
  build_daemon: ^4.0.0
  browser_launcher: ^1.1.0
  collection: ^1.15.0
  crypto: ^3.0.2
  dds: ^5.3.0
  dwds: ^27.1.2
  file: ^7.0.1
  http: ^1.0.0
  http_multi_server: ^3.2.0
  io: ^1.0.3
  logging: ^1.0.2
  meta: ^1.7.0
  path: ^1.8.1
  pool: ^1.5.0
  pubspec_parse: ^1.2.0
  pub_semver: ^2.1.1
  shelf: ^1.3.0
  shelf_proxy: ^1.0.1
  shelf_static: ^1.1.0
  stack_trace: ^1.10.0
  sse: ^4.1.0
  vm_service: ">=14.0.0 <16.0.0"
  vm_service_interface: 2.0.1
  webkit_inspection_protocol: ^1.0.1
  yaml: ^3.1.1

dev_dependencies:
  analysis_config:
    path: ../_analysis_config
  build: ^4.0.8
  build_runner: ^2.15.2
  build_verify: ^3.0.0
  build_version: ^2.1.1
  test: ^1.21.1
  dwds_test_common:
    path: ../dwds_test_common
  test_descriptor: ^2.0.0
  test_process: ^2.0.2
  webdriver: ^3.0.0

executables:
  webdev:

dependency_overrides:
  build_daemon:
    git:
      url: https://github.com/dart-lang/build.git
      ref: 5eefe503ab3a21b00f5be42ddc9accf19bf0b369
      path: build_daemon
  build_runner:
    git:
      url: https://github.com/dart-lang/build.git
      ref: 5eefe503ab3a21b00f5be42ddc9accf19bf0b369
      path: build_runner
  dwds_test_common:
    git:
      url: https://github.com/dart-lang/sdk.git
      ref: cc67fadefe24678e7f020fe42cbb41fed2cd6f0c
      path: pkg/dwds_test_common
