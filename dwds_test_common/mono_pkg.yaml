# See https://pub.dev/packages/mono_repo for details
stages:
  - analyzer_and_format:
      - group:
          - format
          - analyze: --fatal-infos .
        sdk: dev
  - unit_test:
      # Linux tests:
      # Note: `Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &` must be
      # run first for Linux.
      - group:
          - command: Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          - command: mkdir -p ../../third_party/browsers/chrome/chrome && ln -s /usr/bin/google-chrome ../../third_party/browsers/chrome/chrome/google-chrome
          - test: --exclude-tags=release
        sdk: dev
        os:
          - linux
        # Windows tests:
      - group:
          - test: --exclude-tags=release
        sdk: dev
        os:
          - windows
