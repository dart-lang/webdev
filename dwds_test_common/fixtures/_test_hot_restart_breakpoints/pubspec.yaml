name: _test_hot_restart_breakpoints
version: 1.0.0
description: >-
  A fake package used for testing hot restart breakpoints.
publish_to: none
environment:
  sdk: ^3.10.0-0.0.dev

dev_dependencies:
  build_runner: ^2.5.0
  build_web_compilers: ^4.4.12

dependency_overrides:
  # https://github.com/dart-lang/build/issues/4928
  build_web_compilers:
    git:
      url: https://github.com/dart-lang/build.git
      ref: hot-restart-api
      path: builder_pkgs/build_web_compilers

